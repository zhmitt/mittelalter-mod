description = "Verify that an active change has enough evidence to be considered complete."

prompt = """
Read the selected change and relevant current evidence, not historical state logs.

Verify the changed slice and its applicable high-risk controls; do not add unrelated full evidence or independent review. Reuse valid decisions and evidence unless an attested dependency changed. Use @opsx-verifier only when genuinely independent judgment is required.

Inspect existing evidence first; use post-impl-prepare with --change only for missing skeletons. For final completion run workflow/scripts/change-done.sh --change <id> once; it includes post-impl-check. Reserve milestone-sync for durable Claim Release, not ordinary breadcrumbs. Follow AGENTS.md for candidate-bound journey evidence reuse.
"""
